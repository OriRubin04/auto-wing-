camera:
  index: 1
  width: 640
  height: 480
  fps: 30

mavlink:
  connection_string: "tcp:127.0.0.1:5762"  # SITL SERIAL1 — free port, MP uses 5760
  baudrate: 115200
  heartbeat_timeout: 10
  takeoff_altitude: 50  # meters

control:
  # Roll — lateral tracking. In FBWA output = desired bank angle.
  roll_pid:
    kp: 0.35
    ki: 0.005
    kd: 0.03
    output_limit: 0.45
  # Pitch — KEEP SMALL on fixed-wing. Large pitch = stall/crash.
  pitch_pid:
    kp: 0.10
    ki: 0.002
    kd: 0.01
    output_limit: 0.12
  throttle: 0.58
  update_rate_hz: 20

detection:
  model: "yolov8n.pt"
  confidence: 0.4
  iou: 0.45
  device: "cpu"  # "cuda" for Jetson
  fallback_tracker: "CSRT"  # OpenCV tracker type
  max_detection_failures: 10  # frames before fallback

streaming:
  host: "0.0.0.0"
  port: 15000
  quality: 70  # JPEG quality 0-100
  fps_limit: 25

gcs:
  onboard_ip: "127.0.0.1"  # change to Pi IP on real hardware
  video_port: 15000
  control_port: 15001
